###############################################################
# buildspec.yml — Đặt ở ROOT của GitHub repository
# CodeBuild sẽ đọc file này để build Docker images
###############################################################
version: 0.2

env:
  variables:
    AWS_REGION: "ap-southeast-1"
  # ECR_FRONTEND_URL và ECR_BACKEND_URL được inject
  # từ CodeBuild environment variables (xem Terraform module)

phases:
  pre_build:
    commands:
      # Login vào ECR
      - echo "=== Logging in to Amazon ECR ==="
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_FRONTEND_URL

      # Lấy commit hash để tag image (7 ký tự đầu)
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      - echo "Image tag = $IMAGE_TAG"

      # In thông tin build
      - echo "Build started on $(date)"
      - echo "Frontend ECR = $ECR_FRONTEND_URL"
      - echo "Backend ECR  = $ECR_BACKEND_URL"

  build:
    commands:
      - echo "=== Building Frontend Docker Image ==="
      - docker build -t $ECR_FRONTEND_URL:$IMAGE_TAG -t $ECR_FRONTEND_URL:latest ./frontend

      - echo "=== Building Backend Docker Image ==="
      - docker build -t $ECR_BACKEND_URL:$IMAGE_TAG -t $ECR_BACKEND_URL:latest ./backend

  post_build:
    commands:
      - echo "=== Pushing images to ECR ==="
      - docker push $ECR_FRONTEND_URL:$IMAGE_TAG
      - docker push $ECR_FRONTEND_URL:latest
      - docker push $ECR_BACKEND_URL:$IMAGE_TAG
      - docker push $ECR_BACKEND_URL:latest

      # Tạo imagedefinitions.json cho CodeDeploy
      - echo "=== Creating deployment artifacts ==="
      - printf '[{"name":"frontend","imageUri":"%s"}]' $ECR_FRONTEND_URL:$IMAGE_TAG > imagedefinitions.json

      # Thay thế placeholder IMAGE_NAME trong taskdef.json
      - sed -i "s|IMAGE_NAME|$ECR_FRONTEND_URL:$IMAGE_TAG|g" taskdef.json

      - echo "Build completed on $(date)"
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
    - appspec.yml
    - taskdef.json
  discard-paths: no

cache:
  paths:
    # Cache Docker layers để build nhanh hơn lần sau
    - '/root/.docker/**/*'

name: Build and Deploy to ECS

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-southeast-1
  ECR_FRONTEND: 307257806722.dkr.ecr.ap-southeast-1.amazonaws.com/globalmart-frontend
  ECR_BACKEND: 307257806722.dkr.ecr.ap-southeast-1.amazonaws.com/globalmart-backend
  ECS_CLUSTER: globalmart-cluster
  ECS_SERVICE_FRONTEND: globalmart-frontend-task
  ECS_SERVICE_BACKEND: globalmart-backend-task

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Frontend
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t $ECR_FRONTEND:$IMAGE_TAG -t $ECR_FRONTEND:latest ./globalmart-app
          docker push $ECR_FRONTEND:$IMAGE_TAG
          docker push $ECR_FRONTEND:latest

      - name: Build and push Backend
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t $ECR_BACKEND:$IMAGE_TAG -t $ECR_BACKEND:latest ./globalmart-api
          docker push $ECR_BACKEND:$IMAGE_TAG
          docker push $ECR_BACKEND:latest

      - name: Deploy Frontend to ECS
        run: |
          IMAGE_TAG=${{ github.sha }}
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition globalmart-frontend-task \
            --region $AWS_REGION \
            --query 'taskDefinition' \
            --output json)
          NEW_TASK_DEF=$(echo $TASK_DEF | python3 -c "
          import json, sys
          td = json.load(sys.stdin)
          for c in td['containerDefinitions']:
              c['image'] = '$ECR_FRONTEND:$IMAGE_TAG'
          for key in ['taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy']:
              td.pop(key, None)
          print(json.dumps(td))
          ")
          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --region $AWS_REGION \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE_FRONTEND \
            --task-definition $NEW_TASK_ARN \
            --force-new-deployment \
            --region $AWS_REGION
          echo "Frontend deployed: $IMAGE_TAG"

      - name: Deploy Backend to ECS
        run: |
          IMAGE_TAG=${{ github.sha }}
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition globalmart-backend-task \
            --region $AWS_REGION \
            --query 'taskDefinition' \
            --output json)
          NEW_TASK_DEF=$(echo $TASK_DEF | python3 -c "
          import json, sys
          td = json.load(sys.stdin)
          for c in td['containerDefinitions']:
              c['image'] = '$ECR_BACKEND:$IMAGE_TAG'
          for key in ['taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy']:
              td.pop(key, None)
          print(json.dumps(td))
          ")
          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --region $AWS_REGION \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE_BACKEND \
            --task-definition $NEW_TASK_ARN \
            --force-new-deployment \
            --region $AWS_REGION
          echo "Backend deployed: $IMAGE_TAG"

      - name: Deployment complete
        run: |
          echo "Deploy triggered successfully"
          echo "Image tag: ${{ github.sha }}"
          echo "Check ECS Console in 2-3 minutes"

      - name: Notify Success via SNS
        if: success()
        run: |
          aws sns publish \
            --topic-arn arn:aws:sns:ap-southeast-1:307257806722:globalmart-alerts \
            --subject "GlobalMart Deploy SUCCESS" \
            --message "
              ========================================
                 GLOBALMART DEPLOY - SUCCESS
              ========================================
              
              Repository   : ${{ github.repository }}
              Branch       : ${{ github.ref_name }}
              Commit       : ${{ github.sha }}
              Commit msg   : ${{ github.event.head_commit.message }}
              Author       : ${{ github.event.head_commit.author.name }}
              Timestamp    : $(date '+%Y-%m-%d %H:%M:%S %Z')
              
              ----------------------------------------
              DEPLOYED IMAGES
              ----------------------------------------
              Frontend : $ECR_FRONTEND:${{ github.sha }}
              Backend  : $ECR_BACKEND:${{ github.sha }}
              
              ----------------------------------------
              View details:
              ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              ----------------------------------------
              " \
                          --region ap-southeast-1
      - name: Notify Failure via SNS
        if: failure()
        run: |
          aws sns publish \
            --topic-arn arn:aws:sns:ap-southeast-1:307257806722:globalmart-alerts \
            --subject "GlobalMart Deploy FAILED" \
            --message "
              ========================================
                 GLOBALMART DEPLOY - FAILED
              ========================================
              
              Repository   : ${{ github.repository }}
              Branch       : ${{ github.ref_name }}
              Commit       : ${{ github.sha }}
              Commit msg   : ${{ github.event.head_commit.message }}
              Author       : ${{ github.event.head_commit.author.name }}
              Timestamp    : $(date '+%Y-%m-%d %H:%M:%S %Z')
              
              ----------------------------------------
              Please check the logs for error details
              ----------------------------------------
              View error details:
              ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              ----------------------------------------
              " \
                          --region ap-southeast-1

services:
  db:
    image: mysql:8.4
    container_name: globalmart-mysql
    environment:
      MYSQL_DATABASE: globalmart
      MYSQL_USER: globalmart
      MYSQL_PASSWORD: globalmart
      MYSQL_ROOT_PASSWORD: globalmart
    ports:
      - "3307:3306"
    volumes:
      - globalmart_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pglobalmart"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./globalmart-api
    container_name: globalmart-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/globalmart?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: globalmart
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:8081
    ports:
      - "8080:8080"

  web:
    build:
      context: ./globalmart-app
    container_name: globalmart-app
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  globalmart_mysql_data:
